name: SQL and TrustSoft gateway policy checks
on:
  push:
    paths:
      - 'integrations/jawafa-readonly/**'
      - '.github/workflows/jawafa-readonly-gateway.yml'
  pull_request:
    paths:
      - 'integrations/jawafa-readonly/**'
      - '.github/workflows/jawafa-readonly-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check server JavaScript syntax
        run: node --check integrations/jawafa-readonly/server.mjs
      - name: Run gateway security policy tests
        run: node --test integrations/jawafa-readonly/test/*.test.mjs
